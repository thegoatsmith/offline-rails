name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # The trigger already constrains this to main, so the old ref and event_name
  # guard is gone. `scope` is the same rule as before, decided in ci.yml: when
  # every changed path is documentation, no runner is allocated at all.
  deploy:
    needs: ci
    if: needs.ci.outputs.scope == 'full'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # wrangler.toml is read from the working tree; dist/ is not rebuilt here.
      # ci.yml already built and tested it, and downloading that exact artifact
      # is what makes the deployed bytes the ones the gates actually ran on.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      # wrangler-action installs wrangler whenever it cannot find one, and picks
      # the package manager out of bun.lock -- so the deploy needs bun on the
      # runner even though it builds nothing. Installing hands it the pinned
      # 4.127.1 rather than letting it fetch a version of its own choosing.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=offline-rails
